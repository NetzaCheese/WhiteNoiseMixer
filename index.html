<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>SND-MXR // 白噪音控制台</title>

    <script>
        // 尽早套用已保存的界面风格，避免刷新时先闪一下默认皮肤
        try {
            var savedTheme = localStorage.getItem("uiTheme");
            if (savedTheme) {
                document.documentElement.setAttribute("data-theme", savedTheme);
            }
        } catch (e) {}
    </script>

    <style>
        /* ============================================================
           SND-MXR-1985  复古科幻控制台外观
           配色沿用原有军绿 / 琥珀 / 磷光绿
           ============================================================ */

        :root {
            /* ---------- 核心色板 ---------- */
            --bg:         #080b09;
            --panel:      #101511;
            --panel-2:    #161d17;
            --screen:     #0a0f0b;
            --ink:        #d5e5cb;
            --ink-dim:    #849080;
            --phos:       #a8c78a;
            --phos-hot:   #cdffa8;
            --amber:      #d0b16f;
            --amber-hot:  #ffd88a;
            --line:       #52634a;
            --edge:       #718565;
            --led-off:    #1d2a1e;
            --alert:      #d97b5a;

            /* 上面几个主色的 rgb 写法，专门给带透明度的发光效果用。
               换肤时务必和上面的颜色成对修改，否则发光颜色会和主色对不上。 */
            --phos-rgb:      168, 199, 138;
            --phos-hot-rgb:  205, 255, 168;
            --amber-rgb:     208, 177, 111;
            --amber-hot-rgb: 255, 216, 138;
            --ink-rgb:       213, 229, 203;
            --alert-rgb:     217, 123, 90;

            /* ---------- 阴影与覆盖层 ---------- */
            --sheen:        rgba(255, 255, 255, 0.025);
            --shade:        rgba(0, 0, 0, 0.45);
            --shade-strong: rgba(0, 0, 0, 0.6);
            --scanline:     rgba(0, 0, 0, 0.22);
            --vignette:     rgba(0, 0, 0, 0.55);

            /* ---------- 按钮 ---------- */
            --btn-top:       #2a3527;
            --btn-mid:       #1b231a;
            --btn-bot:       #151c14;
            --btn-hover-top: #3d4f39;
            --btn-hover-mid: #2b3728;
            --btn-hover-bot: #222b21;
            --btn-ink:       #c5d5ba;
            --btn-ink-hot:   #ffffff;
            --depth:         #0a0e0a;
            --primary-line:  #8d7742;
            --on-primary:    #14100a;
            --danger-ink:    #e0a08a;
            --danger-line:   #7d4a38;
            --danger-hi:     #e6a288;
            --danger-lo:     #c9714f;
            --on-danger:     #1a0d08;
            --on-playing:    #0b120b;

            /* ---------- 表单 / 滑块 / 读数窗 ---------- */
            --field:        #0d130e;
            --placeholder:  #5f6b5b;
            --track:        #12180f;
            --track-line:   #2c3a28;
            --tick:         #223021;
            --thumb-hi:     #e8d9a8;
            --thumb-line:   #6d5a30;
            --readout-line: #26311f;
            --badge-line:   #33422f;
            --file-btn:     #202a20;
            --file-btn-hot: #354532;
            --label-ink:    #0d120e;

            /* ---------- 形状与质感（换肤也可以调这几项） ---------- */
            --font: "Consolas", "Courier New", ui-monospace, monospace;
            --corner: 12px;
            --corner-sm: 8px;
            --radius: 2px;
            --scan-opacity: 0.55;
            --vignette-opacity: 1;
            --corner-clip: polygon(
                var(--corner) 0, 100% 0, 100% calc(100% - var(--corner)),
                calc(100% - var(--corner)) 100%, 0 100%, 0 var(--corner)
            );
            --corner-clip-sm: polygon(
                var(--corner-sm) 0, 100% 0, 100% 100%, 0 100%, 0 var(--corner-sm)
            );
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            padding: 24px 20px 48px;
            background-color: var(--bg);
            /* 远处的地平线辉光 */
            background-image:
                radial-gradient(120% 70% at 50% 118%, rgba(var(--phos-rgb), 0.10), transparent 62%),
                radial-gradient(90% 55% at 50% -12%, rgba(var(--amber-rgb), 0.07), transparent 60%);
            background-attachment: fixed;
            color: var(--ink);
            font-family: var(--font);
            font-size: 15px;
            line-height: 1.6;
        }

        /* ---------- CRT 扫描线 + 暗角（覆盖层，不拦鼠标） ---------- */
        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 90;
        }

        body::before {
            background: repeating-linear-gradient(
                to bottom,
                var(--scanline) 0px,
                var(--scanline) 1px,
                transparent 1px,
                transparent 3px
            );
            opacity: var(--scan-opacity);
            mix-blend-mode: multiply;
        }

        body::after {
            background: radial-gradient(115% 90% at 50% 50%, transparent 55%, var(--vignette) 100%);
            opacity: var(--vignette-opacity);
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 940px;
            margin: 0 auto;
        }

        /* ============================================================
           面板通用
           ============================================================ */

        .panel {
            position: relative;
            margin-bottom: 20px;
            padding: 18px 20px 20px;
            background:
                linear-gradient(180deg, var(--sheen), transparent 40%),
                var(--panel);
            border: 1px solid var(--line);
            /* 四角切角，机箱感（切角大小由 --corner 控制，换肤可改） */
            clip-path: var(--corner-clip);
            box-shadow:
                0 0 0 1px var(--shade-strong),
                0 0 26px rgba(var(--phos-rgb), 0.05) inset;
        }

        .panel::before {
            /* 机箱铭牌 */
            content: attr(data-label);
            position: absolute;
            top: 0;
            left: 0;
            padding: 3px 12px 4px;
            background: var(--line);
            color: var(--label-ink);
            font-size: 10px;
            letter-spacing: 2.4px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .panel > *:first-child {
            margin-top: 18px;
        }

        /* ============================================================
           标题区
           ============================================================ */

        .masthead {
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--line);
        }

        h1 {
            margin: 0 0 6px;
            color: var(--amber);
            font-size: clamp(22px, 4.4vw, 34px);
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow:
                0 0 6px rgba(var(--amber-rgb), 0.55),
                0 0 22px rgba(var(--amber-rgb), 0.22);
            animation: flicker 5.5s infinite steps(1);
        }

        @keyframes flicker {
            0%, 96%, 100% { opacity: 1; }
            96.5%         { opacity: 0.72; }
            97%           { opacity: 1; }
            97.5%         { opacity: 0.85; }
        }

        .masthead .sub {
            color: var(--ink-dim);
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ============================================================
           状态行 / 自检日志
           ============================================================ */

        .statusbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 26px;
            margin: 14px 0 0;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .statusbar .kv {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .statusbar .k {
            color: var(--ink-dim);
            text-transform: uppercase;
        }

        .statusbar .v {
            color: var(--phos-hot);
            text-shadow: 0 0 8px rgba(var(--phos-hot-rgb), 0.35);
        }

        .bootlog {
            margin: 12px 0 0;
            padding: 10px 12px;
            max-height: 96px;
            overflow: hidden;
            background: var(--screen);
            border: 1px solid var(--readout-line);
            color: var(--ink-dim);
            font-size: 11.5px;
            line-height: 1.75;
            letter-spacing: 0.4px;
        }

        .bootlog .ln {
            opacity: 0;
            animation: bootline 0.4s forwards;
        }

        .bootlog .ln.ok::after {
            content: "OK";
            float: right;
            color: var(--phos-hot);
        }

        .bootlog .ln b {
            color: var(--amber);
            font-weight: normal;
        }

        @keyframes bootline {
            from { opacity: 0; transform: translateX(-6px); }
            to   { opacity: 1; transform: none; }
        }

        .bootlog .ln:nth-child(1) { animation-delay: 0.05s; }
        .bootlog .ln:nth-child(2) { animation-delay: 0.28s; }
        .bootlog .ln:nth-child(3) { animation-delay: 0.51s; }
        .bootlog .ln:nth-child(4) { animation-delay: 0.74s; }
        .bootlog .ln:nth-child(5) { animation-delay: 0.97s; }

        .caret {
            display: inline-block;
            width: 8px;
            height: 13px;
            background: var(--phos-hot);
            vertical-align: -2px;
            animation: blink 1.05s steps(1) infinite;
        }

        @keyframes blink {
            0%, 49%   { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* ============================================================
           按钮 —— 航空拨动开关质感
           ============================================================ */

        button {
            position: relative;
            margin: 0;
            padding: 9px 16px 8px;
            background:
                linear-gradient(180deg, var(--btn-top) 0%, var(--btn-mid) 55%, var(--btn-bot) 100%);
            color: var(--btn-ink);
            border: 1px solid var(--edge);
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 12.5px;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            cursor: pointer;
            /* 顶部高光 + 底部厚度 */
            box-shadow:
                inset 0 1px 0 rgba(var(--ink-rgb), 0.16),
                0 2px 0 var(--depth),
                0 3px 8px var(--shade);
            transition: background 0.12s, color 0.12s, box-shadow 0.12s, transform 0.06s;
        }

        button:hover {
            background:
                linear-gradient(180deg, var(--btn-hover-top) 0%, var(--btn-hover-mid) 55%, var(--btn-hover-bot) 100%);
            color: var(--btn-ink-hot);
            border-color: var(--phos);
            box-shadow:
                inset 0 1px 0 rgba(var(--ink-rgb), 0.24),
                0 0 12px rgba(var(--phos-rgb), 0.30),
                0 2px 0 var(--depth);
        }

        button:active {
            transform: translateY(2px);
            box-shadow:
                inset 0 2px 5px var(--shade-strong),
                0 0 0 var(--depth);
        }

        button:focus-visible {
            outline: 1px dashed var(--amber);
            outline-offset: 2px;
        }

        /* 主控按钮（琥珀） */
        button.primary {
            color: var(--amber);
            border-color: var(--primary-line);
        }

        button.primary:hover {
            color: var(--on-primary);
            background: linear-gradient(180deg, var(--amber-hot), var(--amber));
            border-color: var(--amber-hot);
            box-shadow:
                0 0 16px rgba(var(--amber-rgb), 0.45),
                0 2px 0 var(--depth);
            text-shadow: none;
        }

        /* 危险按钮 */
        button.danger {
            color: var(--danger-ink);
            border-color: var(--danger-line);
        }

        button.danger:hover {
            color: var(--on-danger);
            background: linear-gradient(180deg, var(--danger-hi), var(--danger-lo));
            border-color: var(--danger-hi);
            box-shadow: 0 0 14px rgba(var(--alert-rgb), 0.45), 0 2px 0 var(--depth);
        }

        button.tiny {
            padding: 5px 10px 4px;
            font-size: 10.5px;
            letter-spacing: 1.2px;
        }

        /* 通道按钮的「播放中」态 */
        button.playing {
            color: var(--on-playing);
            background: linear-gradient(180deg, var(--phos-hot), var(--phos));
            border-color: var(--phos-hot);
            box-shadow:
                0 0 18px rgba(var(--phos-rgb), 0.55),
                0 2px 0 var(--depth);
            text-shadow: none;
        }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* ============================================================
           声音通道
           ============================================================ */

        #soundList {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .channel {
            display: grid;
            grid-template-columns:92px 150px 1fr 58px;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            background:
                linear-gradient(90deg, rgba(var(--phos-rgb), 0.045), transparent 45%),
                var(--panel-2);
            border: 1px solid var(--track-line);
            border-left: 3px solid var(--line);
            clip-path: var(--corner-clip-sm);
            transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
        }

        .channel:hover {
            border-color: var(--line);
            box-shadow: 0 0 20px rgba(var(--phos-rgb), 0.09) inset;
        }

        .channel.is-on {
            border-left-color: var(--phos-hot);
            box-shadow:
                0 0 22px rgba(var(--phos-rgb), 0.14) inset,
                0 0 12px rgba(var(--phos-rgb), 0.10);
        }

        .channel .id {
            color: var(--ink-dim);
            font-size: 10.5px;
            letter-spacing: 1.4px;
        }

        .channel .id .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            margin-right: 7px;
            border-radius: 50%;
            background: var(--led-off);
            border: 1px solid var(--badge-line);
            vertical-align: 1px;
            transition: background 0.15s, box-shadow 0.15s;
        }

        .channel.is-on .id .dot {
            background: var(--phos-hot);
            box-shadow: 0 0 10px var(--phos-hot);
        }

        .channel .name {
            color: var(--amber);
            font-size: 13.5px;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            overflow: hidden;
            text-overflow: ellipsis;

    <script>
        // =========================================

        // 所有音频文件都放在 sounds/ 子文件夹里，要改位置只需改这一行
        const AUDIO_DIR = "sounds/";

            }
            /*

                category: "常规",
                fileName: "",
                volume: 0.5,
                loop: true
            }
            */
        ];


        // =========================================
        // 音频引擎
        // =========================================
        //
        // 为什么不用 <audio> 标签的 loop：
        //   它的循环不是样本级精确的。播到结尾时，浏览器要把播放位置跳回开头、
        //   并重新启动解码输出管线，这个往返要几十毫秒，听感上就是「卡一下」。
        //   这跟音频格式无关——MP3 / OGG / WAV 都一样。
        //   Web Audio 的 AudioBufferSourceNode.loop 在音频线程里直接循环，
        //   没有跳转，所以是真正无缝的。
        //
        // 注意：直接双击打开（file://）时，浏览器不允许网页读取本地音频文件，
        //   这时会自动退回 <audio> 标签播放——能出声，但循环会有那个停顿。
        //   想要无缝循环，请通过网址访问（或起个本地服务）。

        const AudioCtor = window.AudioContext || window.webkitAudioContext;

        // file:// 下读取本地文件会被浏览器拦掉，直接走退回方案，省得白试一次
        const LOCAL_FILE_MODE = location.protocol === "file:";

        let audioCtx = null;


        // 补齐每条音频的运行期字段
        sounds.forEach(sound => {

            sound.url = AUDIO_DIR + sound.fileName;
            sound.volume = typeof sound.volume === "number" ? sound.volume : 0.5;
            sound.loop = sound.loop !== false;

            sound.playing = false;   // 是否正在出声
            sound.offset = 0;        // 暂停时记下的播放位置
            sound.status = "loading";

        });


        // 创建 / 恢复音频上下文。浏览器要求由用户操作触发才能出声，
        // 所以这里只做「唤醒」，真正的播放由点击驱动。
        function ensureAudioContext() {

            if (!AudioCtor) {
                return null;
            }

            if (!audioCtx) {

                try {
                    audioCtx = new AudioCtor();
                } catch (e) {
                    return null;
                }

            }

            if (audioCtx.state === "suspended") {
                audioCtx.resume();
            }

            return audioCtx;

        }


        // 解码：优先用 Promise 形式，老浏览器退回回调形式
        function decodeAudio(ctx, arrayBuffer) {

            return new Promise((resolve, reject) => {

                const result = ctx.decodeAudioData(arrayBuffer, resolve, reject);

                if (result && typeof result.then === "function") {
                    result.then(resolve, reject);
                }

            });

        }


        // 把一段音频数据解码后挂到这条通道上
        function attachBuffer(sound, index, dataPromise) {

            const ctx = ensureAudioContext();

            if (!ctx) {
                useElementFallback(sound, index, sound.url);
                return;
            }

            sound.status = "loading";

            dataPromise
                .then(buffer => decodeAudio(ctx, buffer))
                .then(decoded => {

                    sound.buffer = decoded;
                    sound.status = "ready";

                    // 每条通道一个 GainNode，音量改这里
                    sound.gain = ctx.createGain();
                    sound.gain.gain.value = sound.volume;
                    sound.gain.connect(ctx.destination);

                    if (channelNotice.get(index) === "buffering") {
                        channelNotice.delete(index);
                    }

                    syncChannel(sound, index);

                    // 用户已经点过播放、当时还没准备好：现在补上
                    if (sound.wantPlay) {
                        sound.wantPlay = false;
                        startSound(sound, index);
                    }

                })
                .catch(() => {

                    // 解码不了（例如 file:// 下取不到文件），退回 <audio> 标签
                    useElementFallback(sound, index, sound.url);

                });

        }


        // 载入内置音频
        function loadSound(sound, index) {

            sound.playing = false;
            sound.offset = 0;

            if (LOCAL_FILE_MODE) {
                useElementFallback(sound, index, sound.url);
                return;
            }

            attachBuffer(sound, index, fetch(sound.url).then(response => {

                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }

                return response.arrayBuffer();

            }));

        }


        // 退回 <audio> 标签播放（能出声，但循环会有停顿）
        function useElementFallback(sound, index, url) {

            if (sound.audio) {
                return;
            }

            const audio = new Audio(url);

            audio.loop = sound.loop;
            audio.volume = sound.volume;
            audio.preload = "auto";

            audio.addEventListener("playing", () => {
                sound.playing = true;
                channelNotice.delete(index);
                syncChannel(sound, index);
                updateStatus();
            });

            audio.addEventListener("pause", () => {
                sound.playing = false;
                syncChannel(sound, index);
                updateStatus();
            });

            audio.addEventListener("waiting", () => {
                channelNotice.set(index, "buffering");
                syncChannel(sound, index);
            });

            audio.addEventListener("error", () => {
                sound.status = "error";
                channelNotice.set(index, "error");
                syncChannel(sound, index);
            });

            sound.audio = audio;
            sound.status = "ready";

            audio.load();

            syncChannel(sound, index);

        }


        // 这条通道现在是否在出声
        function isSoundPlaying(sound) {

            if (sound.audio) {
                return !sound.audio.paused;
            }

            return sound.playing === true;

        }


        // 设置音量（同时照顾 Web Audio 与退回模式）
        function setVolume(sound, value) {

            sound.volume = value;

            if (sound.gain) {
                sound.gain.gain.value = value;
            }

            if (sound.audio) {
                sound.audio.volume = value;
            }

        }

        // 电平条格数
        const METER_SEGMENTS = 18;

        // 每条通道的临时提示状态：index -> "buffering" | "error"
        const channelNotice = new Map();

        // 把用户输入安全地放进 HTML
        // （预设名、上传的文件名都可能含 < > " 等特殊字符）
        function escapeHtml(text) {

            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");

        }

        // 给动态添加的音频生成唯一 id
        function makeSoundId() {

            return "snd-" +
                Date.now().toString(36) + "-" +
                Math.random().toString(36).slice(2, 8);

        }


        // =========================================
        // 面板状态
        // =========================================

        function updateStatus() {

            const running = sounds.filter(s => isSoundPlaying(s)).length;

            document.getElementById("stChannels").textContent =
                String(sounds.length).padStart(2, "0");

            document.getElementById("stRunning").textContent =
                String(running).padStart(2, "0");

            document.getElementById("stState").textContent =
                running === 0 ? "待机" : (running === sounds.length ? "全线输出" : "部分输出");

        }


        // =========================================
        // 分类筛选
        // =========================================

        // 当前选中的分类，「全部」表示不筛选
        let activeCategory = "全部";


        // 分类名按清单里的出现顺序排列，第一个永远是「全部」
        function categoryList() {

            const names = ["全部"];

            sounds.forEach(sound => {

                const category = sound.category || "常规";

                if (!names.includes(category)) {
                    names.push(category);
                }

            });

            return names;

        }


        function countInCategory(category) {

            if (category === "全部") {
                return sounds.length;
            }

            return sounds.filter(s => (s.category || "常规") === category).length;

        }


        // 这条通道在当前筛选下要不要显示
        function isVisible(sound) {

            return activeCategory === "全部" ||
                (sound.category || "常规") === activeCategory;

        }


        function renderCategories() {

            const row = document.getElementById("catRow");

            if (!row) {
                return;
            }

            const names = categoryList();

            // 选中的分类可能已经不存在了（比如那批音频被删了），退回「全部」
            if (!names.includes(activeCategory)) {
                activeCategory = "全部";
            }

            row.innerHTML = "";

            names.forEach(category => {

                const button = document.createElement("button");

                button.type = "button";
                button.className =
                    "cat" + (category === activeCategory ? " is-active" : "");
                button.setAttribute(
                    "aria-pressed",
                    category === activeCategory ? "true" : "false"
                );
                button.setAttribute("aria-label", "分类：" + category);

                button.innerHTML =
                    escapeHtml(category) +
                    '<span class="cat-count">' + countInCategory(category) + "</span>";

                button.onclick = () => {

                    activeCategory = category;

                    renderCategories();
                    renderSounds();

                };

                row.appendChild(button);

            });

        }


        // =========================================
        // 显示声音列表
        // =========================================

        function renderSounds() {

            const list = document.getElementById("soundList");

            list.innerHTML = "";

            sounds.forEach((sound, index) => {

                // 分类筛选：不匹配的通道不渲染。
                // index 仍然是它在总清单里的原始下标，
                // 所以按钮上的 changeVolume(3, …) 依然指向正确的通道。
                if (!isVisible(sound)) {
                    return;
                }

                const volume = Math.round(sound.volume * 100);

                const div = document.createElement("div");

                div.className = "channel";

                div.dataset.index = index;

                // 电平条
                let segments = "";

                for (let i = 0; i < METER_SEGMENTS; i++) {
                    segments += "<i></i>";
                }

                // 文件名 / 预设名可能含特殊字符，写进 HTML 前先转义
                const safeName = escapeHtml(sound.name);

                div.innerHTML = `
                    <span class="id"><span class="dot"></span>CH${String(index + 1).padStart(2, "0")}</span>

                    <span class="name" title="${safeName}">${safeName}</span>

                    <span class="meter-wrap">
                        <span class="meter">${segments}</span>
                        <input
                            type="range"
                            min="0"
                            max="100"
                            value="${volume}"
                            aria-label="${safeName} 音量"
                            oninput="changeVolume(${index}, this.value)"
                        >
                    </span>

                    <span class="readout" id="volume-${index}">${volume}%</span>

                    <button
                        class="tiny"
                        id="toggle-${index}"
                        onclick="toggleSound(${index})"
                    >▶ 播放</button>
                `;

                list.appendChild(div);

            });

            // 恢复每条通道的按钮文字与电平
            sounds.forEach((sound, index) => {

                syncChannel(sound, index);

                paintMeter(index, sound.volume);

            });

            updateStatus();

        }


        // =========================================
        // 同步单条通道的显示
        // =========================================

        function syncChannel(sound, index) {

            const row = document.querySelector(`.channel[data-index="${index}"]`);

            if (!row) {
                return;
            }

            const button = document.getElementById("toggle-" + index);

            const notice = channelNotice.get(index);

            const playing = isSoundPlaying(sound);

            row.classList.toggle("is-on", playing);

            if (button) {

                if (notice === "error") {

                    button.textContent = "载入失败";
                    button.classList.remove("playing");

                } else if (notice === "buffering") {

                    button.textContent = "缓冲中…";
                    button.classList.remove("playing");

                } else {

                    button.textContent = playing ? "❚❚ 暂停" : "▶ 播放";
                    button.classList.toggle("playing", playing);

                }

            }

        }


        // =========================================
        // 电平条
        // =========================================

        function paintMeter(index, volume) {

            const row = document.querySelector(`.channel[data-index="${index}"]`);

            if (!row) {
                return;
            }

            const segs = row.querySelectorAll(".meter i");

            const lit = Math.round(volume * METER_SEGMENTS);

            segs.forEach((seg, i) => {

                seg.classList.toggle("on", i < lit);

                seg.classList.toggle("hot", i < lit && i >= METER_SEGMENTS * 0.72);

                seg.classList.toggle("peak", i < lit && i >= METER_SEGMENTS * 0.9);

            });

        }


        // =========================================
        // 播放 / 暂停
        // =========================================

        // 开始播放。Web Audio 的 source 是一次性的，每次播放都要新建一个。
        function startSound(sound, index) {

            // 退回 <audio> 标签的情况
            if (sound.audio) {

                const promise = sound.audio.play();

                // 浏览器可能因自动播放策略拒绝，静默处理避免控制台报错
                if (promise && typeof promise.catch === "function") {
                    promise.catch(() => {});
                }

                return;

            }

            const ctx = ensureAudioContext();

            // 还没解码完：先记住用户想播，准备好后自动开始
            if (!ctx || !sound.buffer) {

                sound.wantPlay = true;

                channelNotice.set(
                    index,
                    sound.status === "error" ? "error" : "buffering"
                );

                syncChannel(sound, index);
                return;

            }

            if (sound.playing) {
                return;
            }

            const source = ctx.createBufferSource();

            source.buffer = sound.buffer;
            source.loop = sound.loop;
            source.connect(sound.gain);

            // 从上次暂停的位置接着播（循环时取余）
            const duration = sound.buffer.duration || 0;
            const offset = duration > 0 ? (sound.offset % duration) : 0;

            source.start(0, offset);

            sound.source = source;
            sound.startedAt = ctx.currentTime;
            sound.playing = true;
            sound.wantPlay = false;

            channelNotice.delete(index);
            syncChannel(sound, index);
            updateStatus();

        }


        // 暂停。记下当前位置，下次接着播。
        function stopSound(sound, index) {

            if (sound.audio) {
                sound.audio.pause();
                return;
            }

            if (!sound.playing || !sound.source || !audioCtx) {
                return;
            }

            const duration = sound.buffer.duration || 0;
            const elapsed = audioCtx.currentTime - sound.startedAt;

            sound.offset = duration > 0
                ? ((sound.offset || 0) + elapsed) % duration
                : 0;

            try {
                sound.source.stop();
            } catch (e) {}

            try {
                sound.source.disconnect();
            } catch (e) {}

            sound.source = null;
            sound.playing = false;

            syncChannel(sound, index);
            updateStatus();

        }


        // 请求播放：还没准备好时先亮出「缓冲中…」，
        // 避免朋友点了按钮没反应、误以为坏了
        function requestPlay(index) {

            const sound = sounds[index];

            if (isSoundPlaying(sound)) {
                return;
            }

            startSound(sound, index);

        }


        function toggleSound(index) {

            const sound = sounds[index];

            if (isSoundPlaying(sound)) {

                stopSound(sound, index);

            } else {

                requestPlay(index);

            }

        }


        // =========================================
        // 修改音量
        // =========================================

        function changeVolume(index, value) {

            const sound = sounds[index];

            setVolume(sound, value / 100);

            document.getElementById("volume-" + index).textContent = value + "%";

            paintMeter(index, value / 100);

            syncChannel(sound, index);

            updateStatus();

        }


        // =========================================
        // 全部播放 / 全部暂停 / 静音
        // =========================================

        function playAll() {

            sounds.forEach((sound, index) => {
                requestPlay(index);
            });

        }


        function pauseAll() {

            sounds.forEach((sound, index) => {
                if (isSoundPlaying(sound)) {
                    stopSound(sound, index);
                }
            });

        }


        function muteAll() {

            sounds.forEach((sound, index) => {

                setVolume(sound, 0);

                const slider = document.querySelector(`.channel[data-index="${index}"] input[type="range"]`);

                if (slider) {
                    slider.value = 0;
                }

                document.getElementById("volume-" + index).textContent = "0%";

                paintMeter(index, 0);

            });

            updateStatus();

        }


        // =========================================
        // 动态添加声音
        // =========================================

        function addSounds() {

            const input = document.getElementById("fileInput");

            if (input.files.length === 0) {
                alert("请先选择音频文件");
                return;
            }

            const added = [];

            for (const file of input.files) {

                // 字段结构与内置音频保持一致
                const sound = {

                    id: makeSoundId(),
                    name: file.name,
                    category: "常规",
                    fileName: "",
                    volume: 0.5,
                    loop: true,

                    // 运行期字段
                    url: URL.createObjectURL(file),
                    playing: false,
                    offset: 0,
                    status: "loading"

                };

                sounds.push(sound);
                added.push({ sound: sound, file: file });

            }

            renderCategories();

            renderSounds();

            // 新加入的音频立刻解码
            added.forEach(entry => {

                const index = sounds.indexOf(entry.sound);

                // 直接从内存里的文件解码，不用再走一次网络
                const data = entry.file.arrayBuffer
                    ? entry.file.arrayBuffer()
                    : fetch(entry.sound.url).then(r => r.arrayBuffer());

                attachBuffer(entry.sound, index, data);

            });

            // 清空选择框
            input.value = "";

        }


        // =========================================
        // 预设
        // =========================================

        function savePreset() {

            const name =
                document.getElementById("presetName").value.trim();

            if (name === "") {

                alert("请先输入预设名称");

                return;

            }

            // 读取以前保存的预设
            const presets =
                JSON.parse(
                    localStorage.getItem("soundPresets") || "{}"
                );

            // 保存每个声音的音量
            const preset = {};

            sounds.forEach(sound => {

                preset[sound.name] = sound.volume;

            });

            presets[name] = preset;

            // 保存到浏览器
            localStorage.setItem(
                "soundPresets",
                JSON.stringify(presets)
            );

            loadPresetList();

            document.getElementById("presetName").value = "";

            alert("预设已保存");

        }


        // =========================================
        // 读取预设列表
        // =========================================

        function loadPresetList() {

            const presets =
                JSON.parse(
                    localStorage.getItem("soundPresets") || "{}"
                );

            const select =
                document.getElementById("presetSelect");

            select.innerHTML =
                '<option value="">选择一个预设</option>';

            for (const name in presets) {

                const option =
                    document.createElement("option");

                option.value = name;
                option.textContent = name;

                select.appendChild(option);

            }

        }


        // =========================================
        // 加载预设
        // =========================================

        function loadPreset() {

            const name =
                document.getElementById("presetSelect").value;

            if (name === "") {
                return;
            }

            const presets =
                JSON.parse(
                    localStorage.getItem("soundPresets") || "{}"
                );

            const preset = presets[name];

            sounds.forEach(sound => {

                if (preset[sound.name] !== undefined) {

                    setVolume(sound, preset[sound.name]);

                }

            });

            renderSounds();

        }


        // =========================================
        // 删除预设
        // =========================================

        function deletePreset() {

            const name =
                document.getElementById("presetSelect").value;

            if (name === "") {
                return;
            }

            const presets =
                JSON.parse(
                    localStorage.getItem("soundPresets") || "{}"
                );

            delete presets[name];

            localStorage.setItem(
                "soundPresets",
                JSON.stringify(presets)
            );

            loadPresetList();

        }


        // =========================================
        // 界面风格（变量层换肤）
        // =========================================

        // 想加新皮肤：在这里加一条，并在 CSS 里复制一整块 [data-theme="..."]
        const THEMES = [
            {
                id: "terminal",
                name: "终端绿",
                desc: "1985 机载终端（默认）",
                swatch: ["#a8c78a", "#d0b16f", "#101511"]
            },
            {
                id: "amber",
                name: "琥珀单色",
                desc: "老式琥珀 CRT",
                swatch: ["#d8a848", "#ffd071", "#14100a"]
            },
            {
                id: "minimal",
                name: "简约浅色",
                desc: "无扫描线、无切角",
                swatch: ["#2f6b4f", "#9a6b1f", "#f7f6f2"]
            },
            {
                id: "neon",
                name: "霓虹青",
                desc: "赛博朋克冷色",
                swatch: ["#35e0d8", "#ff5fd2", "#0a0f1c"]
            }
        ];

        const THEME_KEY = "uiTheme";


        function currentTheme() {

            return document.documentElement.dataset.theme || "terminal";

        }


        function applyTheme(id) {

            document.documentElement.dataset.theme = id;

            try {
                localStorage.setItem(THEME_KEY, id);
            } catch (e) {
                // 隐私模式下可能写不进去，忽略即可
            }

            renderSkins();

        }


        function renderSkins() {

            const grid = document.getElementById("skinGrid");

            if (!grid) {
                return;
            }

            const active = currentTheme();

            grid.innerHTML = "";

            THEMES.forEach(theme => {

                const button = document.createElement("button");

                button.type = "button";
                button.className = "skin" + (theme.id === active ? " is-active" : "");
                button.setAttribute("aria-pressed", theme.id === active ? "true" : "false");
                button.setAttribute("aria-label", "界面风格：" + theme.name);

                const swatches = theme.swatch
                    .map(color => '<i style="background:' + color + '"></i>')
                    .join("");

                button.innerHTML =
                    '<span class="skin-swatch">' + swatches + '</span>' +
                    '<span class="skin-name">' + escapeHtml(theme.name) + '</span>' +
                    '<span class="skin-desc">' + escapeHtml(theme.desc) + '</span>';

                button.onclick = () => applyTheme(theme.id);

                grid.appendChild(button);

            });

        }


        // =========================================
        // 初始化
        // =========================================

        renderCategories();

        renderSounds();

        loadPresetList();

        renderSkins();


        // 自检日志：写清实际的通道数和实际启用的音频引擎
        const bootEngine = document.getElementById("bootEngine");

        if (bootEngine) {
            bootEngine.textContent = LOCAL_FILE_MODE
                ? "<audio> [NOLOOP]"
                : "WEB AUDIO[LOOP]";
        }

        const bootChannels = document.getElementById("bootChannels");

        if (bootChannels) {
            bootChannels.textContent = sounds.length + " 条";
        }


        // =========================================
        // 开始后台载入音频
        // =========================================
        //
        // 页面一打开就下载并解码，朋友读完界面再点播放时通常已经就绪。
        // 事件监听只在退回 <audio> 模式时才需要，已写在 useElementFallback 里。

        sounds.forEach((sound, index) => {
            loadSound(sound, index);
        });

    </script>

</body>

</html>
